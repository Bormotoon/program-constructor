version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Мелкие обновления не стоят отдельного разбора: приложение клиентское,
      # прогон CI по ним всё равно сквозной.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Обновить"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Обновить"
