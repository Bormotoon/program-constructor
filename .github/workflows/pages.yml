name: Публикация на GitHub Pages

# С 2026-09-02 здесь публикуется НЕ конструктор, а страница-перенаправление
# на портал.
#
# Почему сняли копию. Она была живой и растущей: 1 просмотр в день в начале
# августа, 31 к 1 сентября. Но это был трафик МИМО портала — без рекламы, без
# навигации, без лендинга, — и вторая версия одного и того же инструмента,
# которую приходилось бы держать в синхроне. При этом обе копии писали в один
# счётчик Метрики 108745963, и разделить их в отчётах можно было только
# фильтром по домену.
#
# Почему перенаправление, а не удаление Pages целиком. Простое отключение
# отдало бы этим людям 404 и потеряло внешние ссылки; meta refresh + canonical
# переводит их на рабочую версию и склеивает адреса для поиска.
#
# Откат: вернуть шаги сборки (npm ci / npm run build) и путь артефакта dist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация перенаправления
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Заглушка для Jekyll
        run: touch pages/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v5
