<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e293b" />
    <!--
      Заголовок не должен мимикрировать под ЕДСОО (edsoo.ru, «Единое содержание
      общего образования» — портал ИСРО). Прежний вариант читался как официальный
      ресурс: люди приходили по запросу «едсоо конструктор» и отскакивали, поняв
      ошибку. Отскок при 16 тыс. показов в месяц бьёт по поведенческим.
      Здесь и далее — «независимый», год учебный (так ищут), ФГОС (так ищут).
    -->
    <title>Конструктор рабочих программ 2026-2027 по новым ФГОС — без регистрации</title>
    <meta name="description" content="Независимый конструктор рабочих программ на 2026-2027 учебный год: 74 федеральные рабочие программы, тематическое и поурочное планирование, выгрузка в DOCX. Работает в браузере — без регистрации, без личного кабинета, бесплатно." />
    <style>
      /*
        Только то, чего не даёт Tailwind: поля страницы и печать фонов.
        Правила вида .print\:hidden здесь были лишними — их генерирует сам
        Tailwind из вариантов print:, а записаны они были с двойным слэшем
        и потому не совпадали ни с одним классом.
      */
      @page { size: A4; margin: 2cm 1.5cm 2cm 3cm; }
      @media print {
        body { margin: 0; padding: 0; background: #fff; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        table { break-inside: auto; }
        tr { break-inside: avoid; }
        thead { display: table-header-group; }
        /* Блоки РСЯ печатаются вместе с программой, если их не убрать: учитель
           печатает рабочую программу для завуча, а не рекламу. */
        [id^="yandex_rtb"] { display: none !important; }
      }
    </style>
    <!--
      Яндекс.Метрика — тот же счётчик, что и на портале (тема его не печатает:
      приложение лежит физической папкой рядом с WordPress). Один счётчик на
      обоих — иначе рвётся воронка «лендинг → приложение».
      ponytail: только просмотры. Цели (дошёл ли до выгрузки DOCX) — отдельной
      задачей, когда станет понятно, есть ли тут вообще трафик.
    -->
    <script>
      // Локальный прогон в боевой счётчик не пишем. `vite preview` отдаёт этот же
      // прод-бандл, и однажды забытый на двое суток превью нагенерил в Метрике
      // отдельную строку «127.0.0.1:4180» на 200 просмотров (05.08.2026).
      if (!/^(localhost|127\.|\[?::1)/.test(location.hostname)) {
        (function (m, e, t, r, i, k, a) {
          m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
          m[i].l = 1 * new Date();
          for (var j = 0; j < document.scripts.length; j++) { if (document.scripts[j].src === r) return; }
          k = e.createElement(t); a = e.getElementsByTagName(t)[0];
          k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js', 'ym');
        ym(108745963, 'init', { clickmap: true, trackLinks: true, accurateTrackBounce: true });
      }
    </script>
    <!-- noscript-пикселя нет намеренно: приложение — React-SPA, без JS оно не работает,
         считать такого посетителя нечем и незачем. -->
    <!--
      РСЯ, площадка 18503127, ручная расстановка. Тема портала сюда не достаёт:
      приложение лежит физической папкой рядом с WordPress, wp_head не срабатывает.

      Блоков два, оба ставит App.tsx: R-A-18503127-22 в сайдбаре ПОД кнопками и
      вне залипающего контейнера, R-A-18503127-23 под рабочей областью. Внутрь
      панели управления реклама не ставится никогда — именно там авторасстановка
      спрятала «Заполнить из ФРП» (обращение 10.08.2026).

      `yaContextCb` — очередь: render() из компонентов кладётся в неё сразу, а
      context.js разбирает её, когда приедет. Поэтому загрузку откладываем до
      первого действия: бандл РСЯ самый тяжёлый на странице, а оба блока ниже
      сгиба, и отсрочка не стоит ни одного показа.
    -->
    <script>
      window.yaContextCb = window.yaContextCb || [];
      (function () {
        var loaded = false;
        var EV = ['scroll', 'pointerdown', 'keydown', 'touchstart', 'mousemove', 'wheel'];
        function load() {
          if (loaded) { return; }
          loaded = true;
          EV.forEach(function (e) { window.removeEventListener(e, load); });
          var s = document.createElement('script');
          s.src = 'https://yandex.ru/ads/system/context.js';
          s.async = true;
          document.head.appendChild(s);
        }
        EV.forEach(function (e) { window.addEventListener(e, load, { passive: true }); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      🚫 «Отправить на почту» — ВЫКЛЮЧЕНО, НЕ ВКЛЮЧАТЬ БЕЗ ОТДЕЛЬНОГО РЕШЕНИЯ.

      Механизм дописан и проверен целиком (диалог и маршрут — в плагине
      pedobraz-feedback, см. docs/guestbook_runbook.md §8 в репозитории портала),
      но в работу не пущен: не подтверждена доставляемость писем с площадки
      Timeweb до внешних ящиков. Кнопка, обещающая письмо и молча его не
      доставляющая, хуже отсутствующей.

      Код приложения на месте и ничего не стоит: кнопки «На почту» появляются
      только если существует window.PBDeliver (см. src/utils/mailFile.ts), а его
      создаёт ровно этот тег. Раскомментировать — вместе с
      `define( 'PEDOBRAZ_DELIVER_ENABLED', true )` на хосте, одним решением.

      Тег стоит ДО main.tsx намеренно: отложенные скрипты выполняются в порядке
      документа, а приложение спрашивает window.PBDeliver при первой отрисовке.

      <script defer src="/wp-content/plugins/pedobraz-feedback/assets/pedobraz-deliver.js" data-pb-deliver></script>
    -->
    <script type="module" src="/src/main.tsx"></script>
    <!--
      «Напишите нам» — виджет из плагина pedobraz-feedback (педобраз.рф).
      Приложение раздаётся с того же домена по /program-constructor/, поэтому
      относительный /wp-json/ бьёт в тот же WordPress без CORS. Персональные
      данные не сохраняются — см. readme.txt плагина.
    -->
    <script defer src="/wp-content/plugins/pedobraz-feedback/assets/pedobraz-feedback.js" data-pb-feedback></script>
  </body>
</html>
